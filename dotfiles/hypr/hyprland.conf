#------------------------------------------------ NVIDIA -------------------------------------------_
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = ELECTRON_OZONE_PLATFORM_HINT,auto
#--------------------------------------------- Monitor ---------------------------------------------

monitor = , preferred, auto, 1

#--------------------------------------------- Programs ---------------------------------------------

$terminal = wezterm
$mainMod = SUPER

#-------------------------------------------- Input ---------------------------------------------------

input {
	kb_layout = latam
	follow_mouse = 1
}

#------------------------------------------- Estetic ------------------------------------------------

general {
	gaps_in = 5
	gaps_out = 10
	border_size = 2
	layout = dwindle
}
decoration {
	rounding = 8
}

#-------------------------------------------- Keybinding --------------------------------------------------

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1

##Rofi Bind (Search app package)
bind = $mainMod, space, exec, rofi -show drun -theme ~/manchs/dotfiles/rofi/nord.rasi
bind = $mainMod, Tab, exec, rofi -show window -theme ~/manchs/dotfiles/rofi/nord.rasi

##Rezise windows
binde = $mainMod SHIFT, right, resizeactive, 40 0
binde = $mainMod SHIFT, left, resizeactive, -40 0
binde = $mainMod SHIFT, down, resizeactive, 0 40
binde = $mainMod SHIFT, up, resizeactive, 0 -40
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod, mouse:272, movewindow

##ScreenShots binds
# Capturas
bind = $mainMod, delete, exec, hyprshot -m region
bind = $mainMod SHIFT, delete, exec, hyprshot -m window
bind = $mainMod CTRL, delete, exec, hyprshot -m output



#-------------------------------------------- AutoStart ------------------------------------

exec-once = waybar
exec-once = nwg-dock-hyprland -o eDP-1 -p bottom -i 48 -d -hd 800
exec-once = hypr-kdeconnect-portal
